<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worker Login - GetServiceGh</title>
<style>
*{box-sizing:border-box;font-family:sans-serif}
body{margin:0;background:#0D8A4E;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;width:100%;max-width:400px;border-radius:24px;padding:28px 22px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.icon-wrap{width:72px;height:72px;background:#0D8A4E;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.icon-wrap svg{fill:#fff;width:36px;height:36px}
h2{margin:0;text-align:center;font-size:22px}
.sub{text-align:center;color:#666;font-size:14px;margin:6px 0 22px}
label{font-weight:600;font-size:14px;display:block;margin:16px 0 6px}
.input-group{display:flex;background:#f5f5f5;border:1px solid #e8e8e8;border-radius:12px;overflow:hidden}
.input-group .icon{width:48px;display:flex;align-items:center;justify-content:center;background:#f0f0f0;border-right:1px solid #e8e8e8;font-size:18px}
.input-group input{flex:1;border:none;background:transparent;padding:14px 12px;font-size:15px;outline:none}
.eye{width:48px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.btn{width:100%;background:#0D8A4E;color:#fff;border:none;padding:14px;border-radius:12px;font-size:16px;font-weight:600;margin-top:22px}
.links{text-align:center;margin-top:18px;font-size:14px;line-height:1.8}
.links a{color:#0D8A4E;font-weight:600;text-decoration:underline}
.flash-msg{background:#FFF3CD;color:#664d03;padding:12px;border-radius:10px;margin-bottom:10px;border:1px solid #ffec9a;font-size:14px}
</style>
</head>
<body>

<div class="card">
  <div class="icon-wrap">
    <!-- worker icon -->
    <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
  </div>
  <h2>Worker Login</h2>
  <div class="sub">Welcome back to GetServiceGh</div>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}<div class="flash-msg">{{ m }}</div>{% endfor %}
      <script>setTimeout(()=>document.querySelectorAll('.flash-msg').forEach(e=>e.style.display='none'),3000)</script>
    {% endif %}
  {% endwith %}

  <form method="POST" action="/worker_login">
    <label>Email or Phone</label>
    <div class="input-group">
      <div class="icon">✉️</div>
      <input type="text" name="email" placeholder="Enter email or phone" required>
    </div>

    <label>Password</label>
    <div class="input-group">
      <div class="icon">🔒</div>
      <input type="password" name="password" id="pwd" placeholder="Enter password" required>
      <div class="eye" onclick="togglePwd()">👁️</div>
    </div>

    <button class="btn" type="submit">Login</button>
  </form>

  <div class="links">
    No account? <a href="/worker_register">Register as Worker</a><br>
    Are you a customer? <a href="/customer_login">Customer Login</a>
  </div>
</div>

<script>
function togglePwd(){
  const p=document.getElementById('pwd');
  p.type = p.type==='password' ? 'text' : 'password';
}
</script>
</body>
</html>
