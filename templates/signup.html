<!DOCTYPE html>
<html>

<head>
  <title>Join GetService GH</title>
  <head>
<title>Join GetService GH</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
      body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f5f7fa;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    width: 90%;
    max-width: 450px;
}

h2 {
    color: #2c3e50;
    text-align: center;
    margin-bottom: 30px;
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 10px 0 20px 0;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 16px;
    box-sizing: border-box;
}

input:focus {
    border-color: #27ae60;
    outline: none;
}

label {
    font-weight: 600;
    color: #34495e;
}

.btn-register {
    width: 100%;
    background: #27ae60;
    color: white;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

.btn-register:hover {
    background: #219a52;
}

.back-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #3498db;
    text-decoration: none;
}
  </style>

</head>

<body>
  <div class = "container"> 
  <h2>Join GetService GH</h2>

    <form method="POST" action="/signup" enctype="multipart/form-data">
  <input type="text" name="name" placeholder="Full Name" required><br><br>

  <input type="text" name="job_type" placeholder="Skill e.g Plumber" required><br><br>

  <input type="text" name="location" placeholder="Location e.g Kumasi" required><br><br>

  <input type="tel" name="phone" placeholder="Phone Number" required><br><br>

  <label>Years of Experience</label>
  <input type="number" name="years" placeholder="Years of Experience"><br><br>

  <!-- Password field with toggle and confirm -->
<div class="mb-4">
    <label class="block text-sm font-semibold">Password</label>
    <div class="relative">
        <input type="password" id="password" name="password" required 
               class="w-full border p-2 rounded pr-10" placeholder="Enter password">
        <span onclick="togglePassword('password', 'eye1')" class="absolute right-3 top-2 cursor-pointer">
            <i id="eye1" class="fas fa-eye"></i>
        </span>
    </div>
</div>

<div class="mb-4">
    <label class="block text-sm font-semibold">Confirm Password</label>
    <div class="relative">
        <input type="password" id="confirm_password" name="confirm_password" required 
               class="w-full border p-2 rounded pr-10" placeholder="Repeat password">
        <span onclick="togglePassword('confirm_password', 'eye2')" class="absolute right-3 top-2 cursor-pointer">
            <div style="position: relative;">
  <input type="password" id="password" name="password" placeholder="Enter password" style="width: 100%; padding: 10px; padding-right: 35px; border-radius: 8px; border: 1px solid #ccc;">
  <span onclick="togglePassword('password', 'eye1')" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer;">
    <i id="eye1" class="fas fa-eye" style="font-size: 16px; color: #666;"></i>
  </span>
</div>
        </span>
    </div>
    <p id="match_error" style="display:none; color:red; font-size:13px; margin-top:5px;">Passwords do not match!</p>
</div>

<script>
function togglePassword(inputId, eyeId) {
    const input = document.getElementById(inputId);
    const eye = document.getElementById(eyeId);
    if (input.type === 'password') {
        input.type = 'text';
        eye.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        input.type = 'password';
        eye.classList.replace('fa-eye-slash', 'fa-eye');
    }
}

// check match on signup
document.getElementById('confirm_password')?.addEventListener('input', function() {
    const pass = document.getElementById('password').value;
    const confirm = this.value;
    const error = document.getElementById('match_error');
    if (pass !== confirm) {
        error.classList.remove('hidden');
    } else {
        error.classList.add('hidden');
    }
});
</script>

  <label>Upload Profile Photo</label>
  <input type="file" name="profile_pic"><br><br>

  <button type="submit" style="background:green; color:white; padding:10px 20px; border:none;">
  Register
  </button>
</form> 
  <br>
    <a href="/" class="back-link">← Back to Search</a>
    </div>
</body>

</html>
