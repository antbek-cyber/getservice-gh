<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Worker Sign Up - GetServiceGh</title>
</head>
<body class="bg-light">
<div class="container mt-4" style="max-width:500px">
  <h3 class="text-center">Worker Registration</h3>
  <p class="text-center text-muted">Photo will be uploaded to Cloudinary</p>

  {% with messages = get_flashed_messages() %}
  {% if messages %}
  <div id="flash-container">
    {% for message in messages %}
      <div class="flash-msg">{{ message }}</div>
    {% endfor %}
  </div>
  <style>
    #flash-container{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:9999;width:90%;max-width:400px}
    .flash-msg{
      background:#FFF3CD;color:#664d03;padding:12px 16px;border-radius:10px;
      margin-bottom:8px;border:1px solid #ffec9a;
      animation:slideIn .3s ease;
      box-shadow:0 4px 12px rgba(0,0,0,.1);
      font-size:14px;
    }
    @keyframes slideIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
  </style>
  <script>
    setTimeout(()=>{
      document.querySelectorAll('.flash-msg').forEach((el,i)=>{
        setTimeout(()=>{
          el.style.transition='all .4s';
          el.style.opacity='0';
          el.style.transform='translateY(-20px)';
          setTimeout(()=>el.remove(),400);
        }, i*100);
      });
    }, 3000);
  </script>
  {% endif %}
{% endwith %}

  <form action="/signup" method="POST" enctype="multipart/form-data">
    <div class="mb-2">
      <label>Full Name</label>
      <input type="text" name="name" class="form-control" required>
    </div>

    <div class="mb-2">
      <label>Phone Number</label>
      <input type="text" name="phone" class="form-control" required>
    </div>

    <div class="mb-2">
      <label>Job Type / Profession</label>
      <input type="text" name="job_type" class="form-control" placeholder="e.g Plumber" required>
    </div>

    <div class="mb-2">
      <label>Location</label>
      <input type="text" name="location" class="form-control" required>
    </div>

    <div class="mb-2">
      <label>Years of Experience</label>
      <input type="number" name="years" class="form-control" min="0" required>
    </div>

    <div class="mb-2">
      <label>Profile Photo</label>
      <input type="file" name="photo" id="profile_pic" class="form-control" accept="image/*">
      <small class="text-muted">Preview:</small>
      <img id="preview" src="" style="display:none; width:100%; max-height:180px; object-fit:cover; margin-top:8px; border-radius:8px;">
    </div>

    <div class="mb-2" style="position:relative">
      <label>Password</label>
      <input type="password" id="password" name="password" class="form-control" required>
      <span onclick="togglePwd('password')" style="position:absolute; right:12px; top:35px; cursor:pointer">👁️</span>
    </div>

    <div class="mb-3" style="position:relative">
      <label>Repeat Password</label>
      <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
      <span onclick="togglePwd('confirm_password')" style="position:absolute; right:12px; top:35px; cursor:pointer">👁️</span>
    </div>

    <button type="submit" class="btn btn-success w-100">Register as Worker</button>
    <div class="text-center mt-2"><a href="/login">Already have account? Login</a></div>
  </form>
</div>

<script>
function togglePwd(id){
  var el=document.getElementById(id);
  el.type = el.type==='password'? 'text' : 'password';
}
// repeat password check
document.querySelector('form').addEventListener('submit', function(e){
  var p=document.getElementById('password').value;
  var c=document.getElementById('confirm_password').value;
  if(p!== c){ e.preventDefault(); alert('Passwords do not match!'); }
});
// Cloudinary preview - before upload
document.getElementById('profile_pic').addEventListener('change', function(e){
  var file=e.target.files[0];
  if(file){
    var url=URL.createObjectURL(file);
    var img=document.getElementById('preview');
    img.src=url; img.style.display='block';
  }
});
</script>
</body>
</html>
