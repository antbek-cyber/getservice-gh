<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<title>Customer Login - GetServiceGh</title>
<style>
body{ background: linear-gradient(135deg,#0d6efd 0%, #0a58ca 100%); min-height:100vh; display:flex; align-items:center; }
.card{ border-radius:18px; border:none; box-shadow:0 10px 30px rgba(0,0,0,0.2); }
.btn-primary{ border-radius:10px; padding:12px; font-weight:600; }
.form-control{ border-radius:10px; padding:12px; }
</style>
</head>
<body>
<div class="container">
<div class="row justify-content-center">
<div class="col-md-5 col-11">
  <div class="card p-4">
    <div class="text-center mb-4">
      <i class="fas fa-user-circle fa-4x text-primary"></i>
      <h3 class="mt-2 fw-bold">Customer Login</h3>
      <p class="text-muted small">Welcome back to GetServiceGh</p>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}
          <div class="alert alert-warning py-2 small">{{ m }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/customer_login" method="POST">
      <div class="mb-3">
        <label class="form-label">Email or Phone</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-envelope"></i></span>
          <input type="text" name="email" class="form-control" placeholder="Enter email or phone" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          <input type="password" name="password" id="password" class="form-control" placeholder="Enter password" required>
          <span class="input-group-text" onclick="togglePwd()" style="cursor:pointer"><i class="fas fa-eye" id="eyeIcon"></i></span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>

    <div class="text-center mt-3">
      <small>No account? <a href="/customer_register" class="fw-bold">Register as Customer</a></small><br>
      <small>Are you a worker? <a href="/login">Worker Login</a></small>
    </div>
  </div>
</div>
</div>
</div>

<script>
function togglePwd(){
  var p=document.getElementById('password');
  var icon=document.getElementById('eyeIcon');
  if(p.type==='password'){ p.type='text'; icon.classList.replace('fa-eye','fa-eye-slash'); }
  else{ p.type='password'; icon.classList.replace('fa-eye-slash','fa-eye'); }
}
</script>
</body>
</html>
