<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<title>Customer Login - GetServiceGh</title>
<style>
body{ background: linear-gradient(135deg,#198754 0%, #0f5132 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; }
.card{ border-radius:22px; border:none; box-shadow:0 10px 30px rgba(0,0,0,0.25); width:100%; max-width:360px; padding:28px !important; }
.form-control{ border-radius:12px; padding:14px 14px; background:#f8f9fa; border:1px solid #dee2e6; }
.input-group-text{ background:#f1f1f1; border-radius:12px 0 0 12px; border:1px solid #dee2e6; }
.input-group .form-control{ border-radius:0 12px 12px 0; }
.btn-login{ background:#198754; border:none; border-radius:12px; padding:13px; font-weight:600; color:white; width:100%; }
.btn-login:hover{ background:#146c43; }
a{ color:#198754; }
</style>
</head>
<body>
<div class="card">
  <div class="text-center mb-4">
    <div style="width:70px; height:70px; background:#198754; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 12px auto;">
      <i class="fas fa-user fa-2x text-white"></i>
    </div>
    <h4 class="fw-bold mb-1">Customer Login</h4>
    <small class="text-muted">Welcome back to GetServiceGh</small>
  </div>

  {% with messages = get_flashed_messages() %}
  {% if messages %}
  <div id="flash-container">
    {% for message in messages %}
      <div class="flash-msg">{{ message }}</div>
    {% endfor %}
  </div>
  <style>
    #flash-container{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:9999;width:90%;max-width:400px}
    .flash-msg{
      background:#FFF3CD;color:#664d03;padding:12px 16px;border-radius:10px;
      margin-bottom:8px;border:1px solid #ffec9a;
      animation:slideIn .3s ease;
      box-shadow:0 4px 12px rgba(0,0,0,.1);
      font-size:14px;
    }
    @keyframes slideIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
  </style>
  <script>
    setTimeout(()=>{
      document.querySelectorAll('.flash-msg').forEach((el,i)=>{
        setTimeout(()=>{
          el.style.transition='all .4s';
          el.style.opacity='0';
          el.style.transform='translateY(-20px)';
          setTimeout(()=>el.remove(),400);
        }, i*100);
      });
    }, 3000);
  </script>
  {% endif %}
{% endwith %}

  <form action="/customer_login" method="POST">
    <label class="form-label small fw-medium">Email or Phone</label>
    <div class="input-group mb-3">
      <span class="input-group-text"><i class="fas fa-envelope"></i></span>
      <input type="text" name="email" class="form-control" placeholder="Enter email or phone" required>
    </div>

    <label class="form-label small fw-medium">Password</label>
    <div class="input-group mb-4">
      <span class="input-group-text"><i class="fas fa-lock"></i></span>
      <input type="password" name="password" id="password" class="form-control" placeholder="Enter password" required style="border-right:none;">
      <span class="input-group-text" onclick="togglePwd()" style="cursor:pointer; background:#f8f9fa; border-left:none; border-radius:0 12px 12px 0;"><i class="fas fa-eye" id="eyeIcon"></i></span>
    </div>

    <button type="submit" class="btn-login">Login</button>
  </form>

  <div class="text-center mt-3" style="font-size:14px;">
    No account? <a href="/customer_register" class="fw-bold text-decoration-underline">Register as Customer</a><br>
    Are you a worker? <a href="/login" class="fw-bold text-decoration-underline">Worker Login</a>
  </div>
</div>

<script>
function togglePwd(){
  var p=document.getElementById('password');
  var icon=document.getElementById('eyeIcon');
  if(p.type==='password'){ p.type='text'; icon.classList.replace('fa-eye','fa-eye-slash'); }
  else{ p.type='password'; icon.classList.replace('fa-eye-slash','fa-eye'); }
}
</script>
</body>
</html>
