<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GetService GH</title>
<style>
body{font-family:Arial;background:#eef2ff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:white;padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.1);width:90%;max-width:420px;text-align:center}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
.btn{width:100%;padding:12px;border:none;border-radius:10px;color:white;font-weight:bold;cursor:pointer;margin-top:8px}
.blue{background:#0d6efd} .green{background:#198754}
.links{margin:12px 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.links a{color:#0d6efd;text-decoration:none;font-size:14px}
.small-btns{display:flex;gap:8px;margin-top:12px}
.small-btns a{flex:1;padding:10px;border-radius:10px;color:white;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <div style="font-size:40px">🔧</div>
  <h2 style="color:#0d6efd;margin:5px">GetService GH</h2>
  <p>Find trusted workers near you</p>

  <div class="links">
    <a href="/">Home</a>
    <a href="/login">Worker Login</a>
    <a href="/register">Become a Worker</a>
    <a href="/admin">Admin</a>
  </div>

  <form action="/search" method="GET">
    <input name="q" placeholder="What do you need? e.g Plumber">
    <input name="loc" placeholder="Where? e.g Kumasi">
    <button class="btn blue">Search Now</button>
  </form>

  <div class="small-btns">
    <a href="/post-job" style="background:#0d6efd">📢 Post a Job</a>
    <a href="/jobs" style="background:#198754">📋 View Jobs</a>
  </div>
</div>
</body>
</html>
