<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Jobs - GetServiceGH</title>
  <style>
    body{font-family:Arial; background:#f5f5f5; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0}
    .card{background:white; padding:30px; border-radius:15px; box-shadow:0 5px 20px rgba(0,0,0,0.1); width:90%; max-width:400px; text-align:center}
    input{width:100%; padding:12px; margin:15px 0; border:2px solid #ddd; border-radius:8px; font-size:16px; box-sizing:border-box}
    button{width:100%; padding:12px; background:#6c2bd9; color:white; border:none; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer}
    button:hover{background:#5a23b8}
  </style>
</head>
<body>
  <div class="card">
    <h2>🔧 My Jobs</h2>
    <p>Enter your registered phone to view bookings</p>
    <form method="POST">
      <input name="phone" placeholder="0240000000" required type="tel">
      <button>View My Bookings</button>
    </form>
    <br>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
