<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jobs for {{ worker.name }}</title>
  <style>
    body{font-family:Arial; background:#f5f5f5; padding:15px; margin:0}
    .header{background:white; padding:15px; border-radius:10px; margin-bottom:15px}
    .job{background:white; padding:15px; border-radius:10px; margin-bottom:15px; border-left:5px solid #6c2bd9}
    .badge{padding:3px 8px; border-radius:5px; font-size:12px; color:white; background:orange}
    .btn{display:inline-block; padding:8px 15px; background:#25D366; color:white; text-decoration:none; border-radius:5px; margin-top:10px; margin-right:5px}
    .btn-call{background:#007bff}
  </style>
</head>
<body>
  <!-- NEW 1-Click Booking Modal -->
<div id="bookingModal" class="modal">
  <div class="modal-content" style="text-align:center; padding: 25px;">
    <h3 style="margin-bottom:15px;">Book {{ artisan.name }}?</h3>
    
    <p style="color:#555; margin-bottom:20px;">
      We'll send your profile details to {{ artisan.name }}.<br>
      <strong>{{ artisan.service }} in {{ current_user.location or 'your area' }}</strong>
    </p>

    <div style="background:#f0fdf4; padding:12px; border-radius:10px; margin-bottom:20px; text-align:left;">
      <small style="color:#666;">BOOKING AS:</small><br>
      <strong>{{ current_user.name }}</strong><br>
      {{ current_user.phone }}<br>
      {{ current_user.location }}
    </div>

    <div style="display:flex; gap:10px;">
      <button onclick="closeModal()" style="flex:1; padding:12px; border:1px solid #ccc; border-radius:8px; background:white;">Cancel</button>
      
      <form action="/book/{{ artisan.id }}" method="POST" style="flex:1;">
        <button type="submit" style="width:100%; padding:12px; background:#16a34a; color:white; border:none; border-radius:8px; font-weight:bold;">
          ✅ Confirm Booking
        </button>
      </form>
    </div>
  </div>
</div>
  {% endfor %}
</body>
</html>
