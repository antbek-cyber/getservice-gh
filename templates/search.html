<!DOCTYPE html>
<html>
<head>
    <title>Workers Near You</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; padding: 20px; }
        h1 { text-align: center; margin-bottom: 20px; color: #333; }
       .workers-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
            max-width: 1200px;
            margin: 0 auto;
        }
       .card { 
            background: white; 
            border-radius: 10px; 
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
       .card img { width: 100%; height: 220px; object-fit: cover; }
       .card-body { padding: 15px; }
       .name { font-size: 18px; font-weight: bold; }
       .prof { color: #007bff; font-size: 14px; margin-bottom: 8px; }
       .info { font-size: 14px; color: #555; margin: 4px 0; }
       .price { font-size: 20px; font-weight: bold; color: #28a745; margin: 10px 0; }
       .btn { 
            display: block; text-align: center; background: #28a745; color: white; 
            padding: 12px; border-radius: 6px; text-decoration: none; font-weight: bold;
        }
       .btn:hover { background: #218838; }
    </style>
</head>
<body>
    <h1>🔧 Workers Near You</h1>
    
    {% if workers %}
    <div class="workers-grid">
        {% for w in workers %}
        <div class="card">
            <img src="{{ url_for('static', filename='uploads/' + w[8]) if w[8] else url_for('static', filename='default.png') }}" alt="{{ w[1] }}">
            <div class="card-body">
                <div class="name">{{ w[1] }}</div>
                <div class="prof">{{ w[2] }}</div>
                <div class="info">📍 {{ w[3] }}</div>
                <div class="info">💼 {{ w[4] }} yrs exp | ⭐ {{ w[5] }} ({{ w[6] }})</div>
                <div class="price">GHS {{ w[7] }}/day</div>
                <a href="tel:{{ w[9] }}" class="btn">📞 Call {{ w[9] }}</a>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <p style="text-align:center; margin-top:50px;">No workers found for your search</p>
    {% endif %}
</body>
</html>
