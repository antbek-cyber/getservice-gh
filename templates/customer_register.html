<!DOCTYPE html>
<html>
<head>
    <title>Customer Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
{% extends 'base.html' %}
{% block content %}
<div class="container mt-4" style="max-width: 500px;">
  <h3 class="mb-3">Customer Registration</h3>
  
  <form action="{{ url_for('customer_register') }}" method="POST">
    <div class="mb-3">
      <label>Full Name</label>
      <input type="text" name="name" class="form-control" required>
    </div>
    
    <div class="mb-3">
      <label>Email</label>
      <input type="email" name="email" class="form-control" required>
    </div>

    <div class="mb-3">
      <label>Phone (you use this to login)</label>
      <input type="text" name="phone" class="form-control" required>
    </div>

    <div class="mb-3" style="position: relative;">
      <label>Password</label>
      <input type="password" id="password" name="password" class="form-control" required>
      <span onclick="togglePass('password', this)" style="position:absolute; right:12px; top:38px; cursor:pointer;">👁️</span>
    </div>

    <div class="mb-3" style="position: relative;">
      <label>Repeat Password</label>
      <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
      <span onclick="togglePass('confirm_password', this)" style="position:absolute; right:12px; top:38px; cursor:pointer;">👁️</span>
      <small id="pass-error" style="color:red; display:none;">Passwords don't match!</small>
    </div>

    <button type="submit" class="btn btn-primary w-100">Register</button>
  </form>
</div>

<script>
function togglePass(id, el) {
  const input = document.getElementById(id);
  if (input.type === "password") {
    input.type = "text";
    el.textContent = "🙈";
  } else {
    input.type = "password";
    el.textContent = "👁️";
  }
}
document.querySelector('form').addEventListener('submit', function(e) {
  const p1 = document.getElementById('password').value;
  const p2 = document.getElementById('confirm_password').value;
  if (p1 !== p2) {
    e.preventDefault();
    document.getElementById('pass-error').style.display = 'block';
    alert("Passwords don't match!");
  }
});
</script>
{% endblock %}
</body>
</html>
