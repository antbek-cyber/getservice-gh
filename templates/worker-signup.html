<!DOCTYPE html>
<html>
<head>
  <title>Join GetService GH</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
    }
  .container {
      background: white;
      padding: 25px 20px;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 0 auto;
    }
    h2 { text-align: center; color: #007bff; margin-bottom: 20px; }
    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 2px solid #eee;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }
    input[type="file"] { padding: 8px; border: none; }
    label { font-size: 14px; color: #555; font-weight: bold; }
    button {
      width: 100%;
      padding: 14px;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: #1ebe5b; }
  .back-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      text-decoration: none;
      color: #007bff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Join as a Worker</h2>

    <form method="POST" action="/signup" enctype="multipart/form-data">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="text" name="phone" placeholder="WhatsApp Number e.g 0244123456" required>
      <label style="font-weight:bold; margin-bottom:5px; display:block;">Your Skill</label>
<select name="skill" required>
  <option value="">-- Select Your Skill --</option>
  <option value="electrician">⚡ Electrician</option>
  <option value="plumber">🚰 Plumber</option>
  <option value="carpenter">🔨 Carpenter</option>
  <option value="painter">🎨 Painter</option>
  <option value="mechanic">🔧 Mechanic</option>
  <option value="cleaner">🧹 Cleaner</option>
  <option value="mason">🧱 Mason/Brick layer</option>
  <option value="tailor">✂️ Tailor</option>
  <option value="hairdresser">💇 Hairdresser/Barber</option>
  <option value="cook">🍲 Cook/Caterer</option>
</select>
      <input type="text" name="location" placeholder="Your City e.g Kumasi" required>
      <input type="number" name="years" placeholder="Years of Experience" required>

      <label>Upload Profile Photo</label>
      <input type="file" name="photo" accept="image/*">

      <button type="submit">Sign Up Now</button>
    </form>
    <form method="POST" action="/worker-signup">
    <input type="text" name="name" placeholder="Full Name" required><br>
    <input type="text" name="skill" placeholder="Skill e.g Plumber" required><br>
    <input type="text" name="location" placeholder="Location e.g Kumasi" required><br>
    <input type="tel" name="phone" placeholder="Phone Number" required><br>
    <button type="submit">Register</button>
</form>

    <a href="/" class="back-link">← Back to Search</a>
   
  </div>
</body>
</html>
