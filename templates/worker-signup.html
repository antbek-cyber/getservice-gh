<!DOCTYPE html>
<html>
<head>
    <title>Join GetServiceGH</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .signup-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            color: #E86A4B;
            margin-bottom: 30px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        input[type="text"], input[type="tel"], input[type="number"], input[type="password"], input[type="file"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }
        input:focus {
            outline: none;
            border-color: #E86A4B;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #E86A4B;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            background: #d45a3a;
        }
        .back-link {
            text-align: center;
            margin-top: 15px;
        }
        .back-link a {
            color: #E86A4B;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <h2>Join GetServiceGH</h2>
        <form method="POST" enctype="multipart/form-data">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Kwame Mensah" required>

            <label>Phone Number</label>
            <input type="tel" name="phone" placeholder="0543283737" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Create password" required>

            <label>Skill e.g Plumber</label>
            <input type="text" name="job_type" placeholder="Plumber" required>

            <label>Location e.g Kumasi</label>
            <input type="text" name="location" placeholder="Kumasi" required>

            <label>Years of Experience</label>
            <input type="number" name="years" placeholder="5" required>

            <label>Upload Profile Photo</label>
            <input type="file" name="profile_pic" accept="image/*">

            <button type="submit" class="btn">Register</button>
        </form>
        <div class="back-link">
            <a href="/">← Back to Search</a>
        </div>
    </div>
</body>
</html>
