<!DOCTYPE html>
<html>
<head>
    <title>Worker Dashboard</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; max-width: 600px; margin: auto; }
        input, textarea, select { width: 100%; padding: 8px; margin: 6px 0 12px; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #16a34a; color: white; padding: 10px; border: none; border-radius: 5px; width: 100%; cursor: pointer; }
        .pic { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 3px solid #16a34a; }
    </style>
</head>
<body>
<div class="card">
    <h2>Welcome {{ worker.name }}</h2>

    <!-- PROFILE PIC DISPLAY -->
    <div style="margin-bottom:15px;">
        {% if worker.profile_pic %}
            <img src="{{ worker.profile_pic if 'http' in worker.profile_pic else url_for('static', filename='uploads/' + worker.profile_pic) }}" class="pic">
        {% else %}
            <div class="pic" style="background:#ddd; display:flex; align-items:center; justify-content:center;">👤</div>
        {% endif %}
        <p>{{ worker.skill }} - {{ worker.location }}</p>
    </div>

    <!-- UPDATE FORM -->
    <form method="POST" action="{{ url_for('worker_dashboard') }}" enctype="multipart/form-data">
        <label>Profile Photo</label>
        <input type="file" name="profile_pic" accept="image/*">

        <label>Work Photos</label>
        <input type="file" name="work_pics" accept="image/*" multiple>

        <label>Skill</label>
        <input type="text" name="skill" value="{{ worker.skill or '' }}">

        <label>Location</label>
        <input type="text" name="location" value="{{ worker.location or '' }}">

        <label>Fee (GHS)</label>
        <input type="text" name="fee" value="{{ worker.fee or '' }}">

        <label>Bio</label>
        <textarea name="bio">{{ worker.bio or '' }}</textarea>

        <button type="submit">Update Profile</button>
    </form>

    <hr>
    <h3>Your Bookings</h3>
    {% for b in bookings %}
        <p>{{ b.customer_name }} - {{ b.status }}</p>
    {% else %}
        <p>No bookings yet</p>
    {% endfor %}

    <p><a href="/logout">Logout</a></p>
</div>
</body>
</html>
