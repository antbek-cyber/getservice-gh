<!DOCTYPE html>
<html>
<head><title>Worker Dashboard</title>
<style>
 body{font-family:Arial;background:#f4f4f4;padding:20px}
 .card{background:white;padding:20px;border-radius:10px;max-width:600px;margin:auto}
 input,textarea{width:100%;padding:8px;margin:6px 0 12px;border-radius:5px;border:1px solid #ccc}
 button{background:#16a34a;color:white;padding:10px;border:none;border-radius:5px;width:100%;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h2>Welcome {{ worker.name }}</h2>

<!-- DEBUG: Show raw link -->
<p style="font-size:11px;word-break:break-all;background:#eee;padding:5px;">
DEBUG LINK: {{ worker.profile_pic }}
</p>

<!-- FORCE SHOW PHOTO -->
{% if worker.profile_pic %}
  <img src="{{ worker.profile_pic }}" style="width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid #16a34a;display:block;margin:10px 0;">
  <p style="color:green;font-weight:bold;">✅ Photo saved!</p>
{% else %}
  <div style="width:120px;height:120px;border-radius:50%;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:40px;">👤</div>
  <p style="color:red;">❌ No photo yet</p>
{% endif %}

<form method="POST" action="{{ url_for('worker_dashboard') }}" enctype="multipart/form-data">
<label>Profile Photo</label>
<input type="file" name="profile_pic" accept="image/*" required>
<label>Work Photos</label>
<input type="file" name="work_pics" accept="image/*" multiple>
<label>Skill</label>
<input type="text" name="skill" value="{{ worker.skill or '' }}">
<label>Location</label>
<input type="text" name="location" value="{{ worker.location or '' }}">
<label>Fee</label>
<input type="text" name="fee" value="{{ worker.fee or '' }}">
<label>Bio</label>
<textarea name="bio">{{ worker.bio or '' }}</textarea>
<button type="submit">Update Profile</button>
</form>

<p><a href="/logout">Logout</a></p>
</div>
</body>
</html>
