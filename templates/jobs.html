<!DOCTYPE html>
<html>
<head>
    <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Jobs - GetServiceGH</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        h2 { text-align: center; color: #333; }
      .job-card { background: white; padding: 20px; margin: 15px auto; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 600px; }
      .job-type { color: #007bff; font-weight: bold; font-size: 20px; }
      .budget { color: #28a745; font-weight: bold; }
      .btn-group { margin-top: 15px; display: flex; gap: 10px; }
      .btn { padding: 10px 15px; text-decoration: none; border-radius: 6px; color: white; font-weight: bold; text-align: center; flex: 1; }
      .btn-whatsapp { background: #25D366; }
      .btn-call { background: #007bff; }
      .btn:hover { opacity: 0.9; }


        /* Mobile Responsive */
@media (max-width: 768px) {
    .job-card {
        margin: 10px;
        padding: 15px;
    }
    
    .btn-whatsapp, .btn-call {
        width: 100%;
        margin-bottom: 10px;
        display: block;
    }
    
    h1 {
        font-size: 22px;
    }
}
    </style>
</head>
<body>
    <h2>🔧 Available Jobs in Ghana</h2>
    <div style="text-align:center; margin-bottom:20px;">
        <a href="/post-job" class="btn" style="background:#ff9800; display:inline-block;">📢 Post New Job</a>
    </div>
    <hr>
    {% for job in jobs %}
    <div class="job-card">
        <h3 class="job-type">{{ job[3] }}</h3>
        <p><b>📍 Location:</b> {{ job[4] }}</p>
        <p><b>📝 Description:</b> {{ job[5] }}</p>
        <p class="budget"><b>💰 Budget:</b> {{ job[6] }}</p>
        <p><b>👤 Customer:</b> {{ job[1] }}</p>
        
        <div class="btn-group">
            <!-- WHATSAPP BUTTON -->
            <a href="https://wa.me/233{{ job[2][1:] }}" target="_blank" class="btn btn-whatsapp">
                💬 WhatsApp
            </a>
            <!-- CALL BUTTON -->
            <a href="tel:{{ job[2] }}" class="btn btn-call">
                📞 Call
            </a>
        </div>
    </div>
    {% else %}
    <p style="text-align:center;">No jobs posted yet. Be the first!</p>
    {% endfor %}
</body>
</html>
