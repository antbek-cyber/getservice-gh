<!DOCTYPE html>
<html>

<head>
    <title>Available Jobs - GetServiceGH</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #f5f5f5;
        }

        .job-card {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .job-type {
            color: #007bff;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h2>🔧 Available Jobs in Ghana</h2>
    <a href="/post-job"><button>Post New Job</button></a>
    <hr>
    {% for job in jobs %}
    <div class="job-card">
        <h3 class="job-type">{{ job[3] }}</h3>
        <p><b>Location:</b> {{ job[4] }}</p>
        <p><b>Description:</b> {{ job[5] }}</p>
        <p><b>Budget:</b> {{ job[6] }}</p>
        <p><b>Contact:</b> {{ job[1] }} - {{ job[2] }}</p>
    </div>
    {% else %}
    <p>No jobs posted yet. Be the first!</p>
    {% endfor %}
</body>

</html>
