<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial; background:#f9f9f9; padding:20px; text-align:center;}
.card{background:white; padding:25px; border-radius:20px; max-width:400px; margin:auto; box-shadow:0 4px 10px rgba(0,0,0,0.1);}
.stars{display:flex; justify-content:center; gap:8px; font-size:42px; margin:20px 0; cursor:pointer;}
.star{color:#ddd; transition:0.2s;}
.star.active{color:#FFC107;}
.star:hover{transform:scale(1.2);}
textarea{width:100%; padding:12px; border-radius:12px; border:1px solid #ddd; margin-top:15px;}
.btn{width:100%; background:#111; color:white; padding:14px; border:none; border-radius:12px; margin-top:20px; font-weight:bold; font-size:16px;}
</style>
</head>
<body>

<div class="card">
  <h2>Rate Worker #{{ booking.worker_id }}</h2>
  <p style="color:#666;">{{ booking.service }}</p>

  <form method="POST">
    <div class="stars" id="stars">
      <span class="star" data-value="1">★</span>
      <span class="star" data-value="2">★</span>
      <span class="star" data-value="3">★</span>
      <span class="star" data-value="4">★</span>
      <span class="star" data-value="5">★</span>
    </div>

    <input type="hidden" name="rating" id="ratingInput" required>
    <p id="ratingText" style="font-weight:bold; color:#FFC107;"></p>

    <textarea name="review" rows="4" placeholder="Write your experience (optional)..."></textarea>

    <button type="submit" class="btn">Submit Rating</button>
  </form>
</div>

<script>
const stars = document.querySelectorAll('.star');
const input = document.getElementById('ratingInput');
const text = document.getElementById('ratingText');
const labels = ['','Terrible','Bad','Okay','Good','Excellent!'];

stars.forEach(star => {
  star.addEventListener('click', () => {
    const val = star.getAttribute('data-value');
    input.value = val;
    text.innerText = labels[val];
    stars.forEach((s,i) => {
      s.classList.toggle('active', i < val);
    });
  });
});
</script>

</body>
</html>
