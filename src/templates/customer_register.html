<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Customer Register</title>
</head>
<body 
  {% with messages = get_flashed_messages() %}
  {% if messages %}
  <div id="flash-container">
    {% for message in messages %}
      <div class="flash-msg">{{ message }}</div>
    {% endfor %}
  </div>
  <style>
    #flash-container{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:9999;width:90%;max-width:400px}
    .flash-msg{
      background:#FFF3CD;color:#664d03;padding:12px 16px;border-radius:10px;
      margin-bottom:8px;border:1px solid #ffec9a;
      animation:slideIn .3s ease;
      box-shadow:0 4px 12px rgba(0,0,0,.1);
      font-size:14px;
    }
    @keyframes slideIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
  </style>
  <script>
    setTimeout(()=>{
      document.querySelectorAll('.flash-msg').forEach((el,i)=>{
        setTimeout(()=>{
          el.style.transition='all .4s';
          el.style.opacity='0';
          el.style.transform='translateY(-20px)';
          setTimeout(()=>el.remove(),400);
        }, i*100);
      });
    }, 3000);
  </script>
  {% endif %}
{% endwith %}
  class="bg-light">
<div class="container mt-4" style="max-width: 500px;">
  <h3 class="mb-3">Customer Registration</h3>
  <form action="/customer_register" method="POST">
    <div class="mb-3"><label>Full Name</label><input type="text" name="name" class="form-control" required></div>
    <div class="mb-3"><label>Email</label><input type="email" name="email" class="form-control" required></div>
    <div class="mb-3"><label>Phone (you use to login)</label><input type="text" name="phone" class="form-control" required></div>
    <div class="mb-3" style="position:relative;">
      <label>Password</label>
      <input type="password" id="password" name="password" class="form-control" required>
      <span onclick="let i=document.getElementById('password'); i.type=i.type=='password'?'text':'password'" style="position:absolute; right:12px; top:38px; cursor:pointer;">👁️</span>
    </div>
    <div class="mb-3" style="position:relative;">
      <label>Repeat Password</label>
      <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
      <span onclick="let i=document.getElementById('confirm_password'); i.type=i.type=='password'?'text':'password'" style="position:absolute; right:12px; top:38px; cursor:pointer;">👁️</span>
    </div>
    <button type="submit" class="btn btn-primary w-100">Register</button>
  </form>
</div>
<script>
document.querySelector('form').addEventListener('submit', function(e){
  if(document.getElementById('password').value !== document.getElementById('confirm_password').value){
    e.preventDefault(); alert("Passwords don't match!");
  }
});
</script>
</body>
</html>
