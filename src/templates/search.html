<!DOCTYPE html>
<html>
<head>
    
    <title>Workers Near You</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; padding: 20px; }
        h1 { text-align: center; margin-bottom: 20px; color: #333; }
       .workers-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
            max-width: 1200px;
            margin: 0 auto;
        }
       .card {
        background: white;
        border-radius: 10px;
        padding: 15px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        margin: 10px;
        transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-3px); }
    .price { color: #28a745; font-weight: bold; font-size: 18px; }
    .call-btn { background: #28a745; color: white; padding: 10px; border-radius: 5px; text-align: center; margin-top: 10px; font-weight: bold; }
        }
       
       .card-body { padding: 15px; }
       .name { font-size: 18px; font-weight: bold; }
       .prof { color: #007bff; font-size: 14px; margin-bottom: 8px; }
       .info { font-size: 14px; color: #555; margin: 4px 0; }
       .price { font-size: 20px; font-weight: bold; color: #28a745; margin: 10px 0; }
       .btn { 
            display: block; text-align: center; background: #28a745; color: white; 
            padding: 12px; border-radius: 6px; text-decoration: none; font-weight: bold; }
    </style>
</head>
    <div style="max-width: 700px; margin: 0 auto 30px; background:white; padding:20px; border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.1);">
    <form action="/search" method="get">
        <div style="display:flex; gap:10px;">
            <input type="text" name="q" placeholder="Search: Plumber, Electrician..." 
                   value="{{ request.args.get('q', '') }}"
                   style="flex:2; padding:12px; border:1px solid #ddd; border-radius:6px; font-size:16px;">
            
            <input type="text" name="location" placeholder="Location: Kumasi, Accra..." 
                   value="{{ request.args.get('location', '') }}"
                   style="flex:1; padding:12px; border:1px solid #ddd; border-radius:6px; font-size:16px;">
            
            <button type="submit" style="padding:12px 20px; background:#007bff; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">
                Search
            </button>
        </div>
    </form>
</div>
<body>
<style>
.workers-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; max-width: 800px; margin: 20px auto; }
.card { background: white; border-radius: 10px; padding: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-decoration: none; color: #333; display: block; transition: 0.2s; }
.card:hover { transform: translateY(-3px); }
.card-img { 
    width: 100% !important; 
    height: 240px !important; 
    object-fit: cover !important; 
    object-position: top !important;
    border-radius: 8px 8px 0 0 !important;
    display: block !important;
}
.card-body { padding: 15px; }
.price { color: #28a745; font-weight: bold; font-size: 18px; }
.call-btn { background: #28a745; color: white; padding: 10px; border-radius: 5px; text-align: center; margin-top: 10px; font-weight: bold; }
</style>

    <div style="text-align: center; margin-bottom: 20px;">
    <a href="/jobs" style="background: #28a745; color: white; padding: 10px 20px; text-decoration: none; border-radius: 8px;">
        💼 Browse Available Jobs
    </a>
</div>

<h1>🔧 Workers Near You</h1>

{% if workers %}
<div class="workers-grid">
{% for w in workers %}
<a href="/worker/{{ w[0] }}" class="card">
    <img src="{{ url_for('static', filename='uploads/' + (w[8] if w[8] else 'default.png')) }}" class="card-img" alt="{{ w[1] }}">
    <div class="card-body">
        <h3>{{ w[1] }}</h3>
        <p style="color:#007bff;">{{ w[2] }} in {{ w[3] }}</p>
        <p>🛠️ {{ w[5] }} yrs exp | ⭐ {{ w[6] }} ({{ w[7] }} reviews)</p>
        <p class="price">GHS {{ w[4] }}/day</p>
        <div class="call-btn">📞 Call {{ w[9] }}</div>
    </div>
</a>
{% endfor %}
</div>
{% else %}
<p style="text-align:center; margin-top:50px;">No workers found for your search</p>
{% endif %}
</body>
</html>
